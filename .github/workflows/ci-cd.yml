name: CI/CD - Task Manager

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_BACKEND_REPO: task-manager-backend
  ECR_FRONTEND_REPO: task-manager-frontend

jobs:
  test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar tests unitarios
        working-directory: ./backend
        run: mvn -B test

      - name: Compilar el proyecto (empaquetado)
        working-directory: ./backend
        run: mvn -B clean package -DskipTests

  build-and-push:
    name: Build & Push Images to ECR
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push imagen del backend
        working-directory: ./backend
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_BACKEND_REPO:${{ github.sha }} -t $REGISTRY/$ECR_BACKEND_REPO:latest .
          docker push $REGISTRY/$ECR_BACKEND_REPO:${{ github.sha }}
          docker push $REGISTRY/$ECR_BACKEND_REPO:latest

      - name: Build y push imagen del frontend
        working-directory: ./frontend
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_FRONTEND_REPO:${{ github.sha }} -t $REGISTRY/$ECR_FRONTEND_REPO:latest .
          docker push $REGISTRY/$ECR_FRONTEND_REPO:${{ github.sha }}
          docker push $REGISTRY/$ECR_FRONTEND_REPO:latest

      - name: Resumen
        run: |
          echo "Imágenes publicadas en ECR:"
          echo "- $REGISTRY/$ECR_BACKEND_REPO:latest"
          echo "- $REGISTRY/$ECR_FRONTEND_REPO:latest"
